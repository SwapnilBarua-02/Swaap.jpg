<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Swaap.jpg — Exposure Dial</title>
<link href="Style.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter&family=Schoolbell&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <nav>
    <ul class="nav-left">
      <li><a href="index.html">Home</a></li>
    </ul>
    <a href="index.html" class="nav-logo">SwB</a>
    <ul class="nav-right">
      <li><a href="Page2.html">Gallery</a></li>
      <li><a href="Page3.html">BTS</a></li>
      <li><a href="Page4.html">About</a></li>
      <li><a href="ref.html">Reference</a></li>
      <button id="theme-toggle" class="theme-btn">🌚</button>
    </ul>
  </nav>
</header>

<section class="hero">
  <div class="left-side">
    <div class="camera-body">
      <img src="Camera/Camera-Body.png" alt="Camera Body" class="camera-image">

      <div id="dial" class="shutterspeed-dial"></div>
      <div class="dial-hint">
        <img src="Photos/Arrow2.png" alt="Arrow" class="arrow2-hint">
        <span class="hint-text">Scroll Here</span>
      </div>
      <div id="shutter-btn" class="shutter-button"></div>
      <div class="shutter-hint">
        <span class="hint-text">Click here</span>
        <img src="Photos/Arrow.png" alt="Arrow" class="arrow-hint">
      </div>
      <div id="flash"></div>

      <div id="photo-preview">
        <div class="photo-overlay">
          <button id="close-photo" class="photo-btn close-btn">✖</button>
          <a href="Page2.html" class="photo-btn gallery-btn">Explore Gallery</a>
        </div>
      </div>
    </div>
  </div>

  <div class="right-side" id="exposure-box">
    <h1 class="hero-heading">Play with Light</h1>
    <p class="herotext">Click once &Rotate the dial to adjust exposure.</p>
    <p id="exposure-value" class="herotext" style="font-weight:600;">
    Exposure: 0</p>
    <a href="Page2.html" class="explore-btn">Explore Gallery</a>
  </div>
</section>

<footer>
  <p>© 2025 Swapnil Barua</p>
</footer>

<script>

/* ---------- SHUTTER DIAL ---------- */

const dial = document.getElementById('dial');
const exposureBox = document.getElementById('exposure-box');
const exposureText = document.getElementById('exposure-value');
const clickSound = new Audio('Camera/Dial.mp3');
clickSound.volume = 0.4;

let exposure = 0;
let rotation = 0;

dial.addEventListener('wheel', e => {
  e.preventDefault();
  rotation += e.deltaY > 0 ? 2 : -2;
  dial.style.transform = `rotate(${rotation}deg)`;

  exposure = Math.max(-5, Math.min(5, exposure + (e.deltaY > 0 ? .0625 : -.0625)));
  exposureText.textContent = `Exposure: ${exposure.toFixed(1)}`;
  clickSound.currentTime = 0;
  clickSound.play();

  const brightness = 1 + exposure * 0.15;
  exposureBox.style.filter = `brightness(${brightness})`;
});

/* ---------- SHUTTER BUTTON + FLASH ---------- */
const shutterBtn = document.getElementById('shutter-btn');
const flash = document.getElementById('flash');
const photoPreview = document.getElementById('photo-preview');
const closePhoto = document.getElementById('close-photo');
const shutterSound = new Audio('Camera/ShutterClick.wav');
shutterSound.volume = 0.6;

const galleryImages = [
  'Photos/Used/Photos1.JPG', 'Photos/Used/Photos2.JPG', 'Photos/Used/Photos3.JPG',
  'Photos/Used/Photos4.JPG', 'Photos/Used/Photos5.JPG', 'Photos/Used/Photos6.JPG',
  'Photos/Used/Photos7.JPG', 'Photos/Used/Photos8.JPG', 'Photos/Used/Photos9.JPG',
  'Photos/Used/Photos10.JPG'
];

shutterBtn.addEventListener('click', () => {
  shutterSound.currentTime = 0;
  shutterSound.play();

  flash.classList.add('active');
  setTimeout(() => flash.classList.remove('active'), 500);

  const randomImage = galleryImages[Math.floor(Math.random() * galleryImages.length)];
  photoPreview.style.backgroundImage = `url(${randomImage})`;
  photoPreview.classList.add('show');
});

closePhoto.addEventListener('click', () => {
  photoPreview.classList.remove('show');
});

document.querySelector('.shutter-button').classList.add('glow');

/* ---------- THEME TOGGLE ---------- */

const themeToggle = document.getElementById("theme-toggle");
const currentTheme = localStorage.getItem("theme");

if (currentTheme === "dark") {
  document.body.classList.add("dark-mode");
  themeToggle.textContent = "🌞";
}

themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark-mode");
  const isDark = document.body.classList.contains("dark-mode");
  themeToggle.textContent = isDark ? "🌞" : "🌚";
  localStorage.setItem("theme", isDark ? "dark" : "light");
});
</script>

</body>
</html>
