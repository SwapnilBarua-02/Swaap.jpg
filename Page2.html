<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery — Swapnil Barua</title>
<link rel="stylesheet" href="Style.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400&family=Schoolbell&display=swap" rel="stylesheet">
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursor-ring"></div>

<header id="site-header" class="scrolled">
  <nav>
    <a href="index.html" class="nav-logo">SwB</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="Page2.html" class="active">Gallery</a></li>
      <li><a href="Page3.html">BTS</a></li>
      <li><a href="Page4.html">About</a></li>
      <li><a href="Ref.html">Reference</a></li>
      <li><button id="theme-toggle" class="theme-btn">☽</button></li>
    </ul>
  </nav>
</header>

<div class="gallery-wrap">
  <div class="page-header">
    <div class="page-header-left">
      <p class="page-number">02 / Gallery</p>
      <h1 class="page-title">The Work</h1>
    </div>
    <span class="page-count" id="photo-count">36 photographs</span>
  </div>

  <div class="gallery-grid" id="gallery-grid">
    <!-- Photos injected by JS for clean loop -->
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" class="lightbox">
  <button class="lightbox-close" id="lb-close">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lb-prev">‹</button>
  <img class="lightbox-image" id="lb-img" src="" alt="">
  <button class="lightbox-nav lightbox-next" id="lb-next">›</button>
  <div class="lightbox-meta">
    <p class="lightbox-caption" id="lb-caption"></p>
  </div>
</div>

<footer><p>© 2025 Swapnil Barua</p></footer>

<script>
/* ── CURSOR ── */
const cursor = document.getElementById('cursor');
const cursorRing = document.getElementById('cursor-ring');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;cursor.style.left=mx+'px';cursor.style.top=my+'px';});
function animateRing(){rx+=(mx-rx)*0.12;ry+=(my-ry)*0.12;cursorRing.style.left=rx+'px';cursorRing.style.top=ry+'px';requestAnimationFrame(animateRing);}
animateRing();

/* ── THEME ── */
const themeToggle=document.getElementById('theme-toggle');
if(localStorage.getItem('theme')==='light'){document.body.classList.add('light-mode');themeToggle.textContent='○';}
themeToggle.addEventListener('click',()=>{document.body.classList.toggle('light-mode');const l=document.body.classList.contains('light-mode');themeToggle.textContent=l?'○':'☽';localStorage.setItem('theme',l?'light':'dark');});

/* ── GALLERY DATA ── */
const photos = [
  { src:'Photos/Used/Photos1.JPG',  caption:'The quiet start of the morning — soft light through my window.',          orient:'portrait' },
  { src:'Photos/Used/Photos2.JPG',  caption:'Sydney streets right before sunset — a golden calm before rush hour.',     orient:'landscape'},
  { src:'Photos/Used/Photos3.JPG',  caption:'The kind of portrait that doesn\'t need words — just stillness.',           orient:'portrait' },
  { src:'Photos/Used/Photos4.JPG',  caption:'Old walls and new stories — light reflecting off faded paint.',            orient:'portrait' },
  { src:'Photos/Used/Photos5.JPG',  caption:'Late afternoon glow — the world slowing down for a minute.',               orient:'portrait' },
  { src:'Photos/Used/Photos6.JPG',  caption:'A moment between chaos — soft shadows on brick.',                          orient:'portrait' },
  { src:'Photos/Used/Photos7.JPG',  caption:'Movement and blur — chasing rhythm through light.',                        orient:'landscape'},
  { src:'Photos/Used/Photos8.JPG',  caption:'A portrait caught between emotion and expression.',                        orient:'portrait' },
  { src:'Photos/Used/Photos9.JPG',  caption:'Reflections of the city — layers of glass and sky.',                       orient:'landscape'},
  { src:'Photos/Used/Photos10.JPG', caption:'The small corners that hold more stories than they show.',                  orient:'portrait' },
  { src:'Photos/Used/Photos11.JPG', caption:'Soft contrast — the moment where light meets shadow.',                     orient:'portrait' },
  { src:'Photos/Used/Photos12.JPG', caption:'Somewhere between candid and composed.',                                   orient:'portrait' },
  { src:'Photos/Used/Photos13.JPG', caption:'The still air after rain — soft tones and muted skies.',                   orient:'portrait' },
  { src:'Photos/Used/Photos14.JPG', caption:'Portrait of calm — everything else fades in the frame.',                   orient:'portrait' },
  { src:'Photos/Used/Photos15.JPG', caption:'Ocean and horizon blending into a single thought.',                        orient:'landscape'},
  { src:'Photos/Used/Photos16.JPG', caption:'Lines, depth, and the patience of a single frame.',                        orient:'portrait' },
  { src:'Photos/Used/Photos17.JPG', caption:'Warm tones of dusk — ordinary streets turned cinematic.',                  orient:'portrait' },
  { src:'Photos/Used/Photos18.JPG', caption:'Distant clouds rolling over the horizon — motion in stillness.',           orient:'landscape'},
  { src:'Photos/Used/Photos19.JPG', caption:'A quiet face, a strong gaze — the beauty of not performing.',              orient:'portrait' },
  { src:'Photos/Used/Photos20.JPG', caption:'Lines of light through blinds — morning simplicity.',                      orient:'portrait' },
  { src:'Photos/Used/Photos21.JPG', caption:'Everyday architecture, reframed in silence.',                              orient:'portrait' },
  { src:'Photos/Used/Photos22.JPG', caption:'Soft highlights and shadows, like rhythm and pause.',                      orient:'portrait' },
  { src:'Photos/Used/Photos23.JPG', caption:'Texture over perfection — a frame that breathes.',                         orient:'portrait' },
  { src:'Photos/Used/Photos24.JPG', caption:'Captured light spilling across the corner of a table.',                    orient:'portrait' },
  { src:'Photos/Used/Photos25.JPG', caption:'Quiet reflections of a familiar place — home, maybe.',                    orient:'portrait' },
  { src:'Photos/Used/Photos26.JPG', caption:'The edges of a shadow — form dissolving into tone.',                       orient:'portrait' },
  { src:'Photos/Used/Photos27.JPG', caption:'Portraits of still air — the kind that hums softly.',                     orient:'portrait' },
  { src:'Photos/Used/Photos28.JPG', caption:'Evening light over the horizon — everything fades warm.',                  orient:'landscape'},
  { src:'Photos/Used/Photos29.JPG', caption:'Lines, shapes, repetition — order hiding in chaos.',                       orient:'portrait' },
  { src:'Photos/Used/Photos30.JPG', caption:'A long exposure of time itself — roads, lights, motion.',                  orient:'landscape'},
  { src:'Photos/Used/Photos31.JPG', caption:'Faces in passing — those we see but never meet.',                          orient:'portrait' },
  { src:'Photos/Used/Photos32.JPG', caption:'Captured while walking home — that half-dream feeling.',                   orient:'portrait' },
  { src:'Photos/Used/Photos33.JPG', caption:'Subtle light, quiet story — simplicity framed.',                           orient:'portrait' },
  { src:'Photos/Used/Photos34.JPG', caption:'The long road ahead — framed by trees and memory.',                        orient:'landscape'},
  { src:'Photos/Used/Photos35.JPG', caption:'Mood over detail — blur that feels intentional.',                          orient:'portrait' },
  { src:'Photos/Used/Photos36.JPG', caption:'Distant view, infinite calm — this one just felt right.',                  orient:'landscape'},
];

const grid = document.getElementById('gallery-grid');
document.getElementById('photo-count').textContent = photos.length + ' photographs';

photos.forEach((p, i) => {
  const item = document.createElement('div');
  item.className = `gallery-item ${p.orient}`;  // portrait or landscape on the wrapper

  const img = document.createElement('img');
  img.src = p.src;
  img.alt = `Photo ${i+1}`;
  img.loading = 'lazy';

  const overlay = document.createElement('div');
  overlay.className = 'gallery-item-overlay';
  overlay.innerHTML = `<p class="gallery-item-caption">${p.caption}</p>`;

  const num = document.createElement('span');
  num.className = 'gallery-item-num';
  num.textContent = String(i+1).padStart(2,'0');

  item.append(img, overlay, num);
  item.addEventListener('click', () => openLightbox(i));
  grid.appendChild(item);
});

/* ── LIGHTBOX ── */
const lightbox = document.getElementById('lightbox');
const lbImg    = document.getElementById('lb-img');
const lbCap    = document.getElementById('lb-caption');
let current    = 0;

function openLightbox(index) {
  current = index;
  lbImg.src = photos[index].src;
  lbImg.alt = `Photo ${index+1}`;
  lbCap.textContent = photos[index].caption;
  lightbox.classList.add('open');
  lightbox.style.display = 'flex';
}

function closeLightbox() {
  lightbox.classList.remove('open');
  setTimeout(() => lightbox.style.display = 'none', 300);
}

function navigate(dir) {
  current = (current + dir + photos.length) % photos.length;
  lbImg.style.opacity = 0;
  setTimeout(() => {
    lbImg.src = photos[current].src;
    lbCap.textContent = photos[current].caption;
    lbImg.style.opacity = 1;
  }, 200);
}

lbImg.style.transition = 'opacity 0.2s ease';

document.getElementById('lb-close').addEventListener('click', closeLightbox);
document.getElementById('lb-prev').addEventListener('click', () => navigate(-1));
document.getElementById('lb-next').addEventListener('click', () => navigate(1));
lightbox.addEventListener('click', e => { if(e.target===lightbox) closeLightbox(); });

document.addEventListener('keydown', e => {
  if (!lightbox.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'ArrowLeft')  navigate(-1);
});

/* ── SCROLL REVEAL ── */
const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if(e.isIntersecting){ e.target.style.opacity=1; e.target.style.transform='none'; } });
}, { threshold: 0.05 });

document.querySelectorAll('.gallery-item').forEach((el, i) => {
  el.style.opacity = 0;
  el.style.transform = 'translateY(20px)';
  el.style.transition = `opacity 0.5s ${i*0.03}s ease, transform 0.5s ${i*0.03}s ease, box-shadow 0.3s`;
  io.observe(el);
});
</script>
</body>
</html>
